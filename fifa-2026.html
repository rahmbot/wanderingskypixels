<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 · Live Bracket</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #020818;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-glow: rgba(0,212,255,0.35);
    --text: #f0f4ff;
    --text-muted: rgba(240,244,255,0.4);
    --accent: #00d4ff;
    --gold: #ffd700;
    --green: #22c55e;
    --red: #ef4444;
    --card-h: 46px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: auto;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 15% 10%, rgba(0,80,200,0.2) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 90%, rgba(100,0,200,0.16) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0,212,255,0.04) 0%, transparent 70%);
    animation: bgpulse 14s ease-in-out infinite alternate;
  }
  @keyframes bgpulse { from { opacity: .8; } to { opacity: 1.1; } }

  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .page { position: relative; z-index: 1; }

  /* ── HEADER ── */
  header { text-align: center; padding: 48px 24px 28px; }

  .eyebrow {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; display: block; width: 48px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .eyebrow::after { background: linear-gradient(90deg, var(--accent), transparent); }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(26px, 5vw, 54px); font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 45%, #a78bfa 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1.1; letter-spacing: -0.02em;
  }

  .header-meta {
    margin-top: 10px; font-size: 12px; color: var(--text-muted); letter-spacing: 0.07em;
  }

  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-top: 20px; flex-wrap: wrap;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    padding: 5px 14px; border-radius: 100px;
  }
  .pill-live {
    background: rgba(255,50,50,0.12); border: 1px solid rgba(255,80,80,0.3); color: #ff6060;
  }
  .pill-live::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff4444;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }

  .pill-update {
    background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2); color: var(--accent);
  }
  .pill-error {
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #f87171;
  }

  #last-updated { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; margin-top: 8px; }

  /* ── BRACKET SCROLL ── */
  .bracket-scroll { overflow-x: auto; padding: 32px 24px 60px; }

  .bracket {
    display: flex; align-items: stretch;
    min-width: 1120px; max-width: 1560px;
    margin: 0 auto; gap: 0;
    min-height: 720px;
  }

  /* ── COLUMNS ── */
  .col {
    display: flex; flex-direction: column; flex: 1; min-width: 0;
  }
  .col.center-col {
    flex: 0 0 156px; align-items: center; justify-content: center;
  }

  .round-header {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); opacity: .55;
    text-align: center; padding-bottom: 14px;
    white-space: nowrap;
  }

  .matches-col {
    flex: 1; display: flex; flex-direction: column; gap: 8px;
  }

  .match-wrap {
    flex: 1; display: flex; align-items: center;
  }

  /* ── MATCH CARD ── */
  .match {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    backdrop-filter: blur(14px);
    transition: border-color .25s, box-shadow .25s;
    position: relative;
  }
  .match.live-match {
    border-color: rgba(255,200,0,0.4);
    box-shadow: 0 0 24px rgba(255,200,0,0.1);
    animation: liveglow 2s ease-in-out infinite alternate;
  }
  @keyframes liveglow {
    from { box-shadow: 0 0 16px rgba(255,200,0,0.08); }
    to   { box-shadow: 0 0 32px rgba(255,200,0,0.18); }
  }

  .live-badge {
    position: absolute; top: 4px; right: 6px;
    font-size: 8px; font-weight: 800; letter-spacing: 0.1em;
    color: #fbbf24; background: rgba(251,191,36,0.12);
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 4px; padding: 1px 5px;
    animation: blink 1.4s infinite;
  }

  /* ── TEAM ROW ── */
  .team {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px; height: var(--card-h);
    position: relative; border-radius: 0;
  }
  .team:first-of-type { border-radius: 10px 10px 0 0; }
  .team:last-of-type  { border-radius: 0 0 10px 10px; }

  .team-divider { height: 1px; background: var(--border); }

  .flag { font-size: 18px; flex-shrink: 0; width: 26px; text-align: center; }

  .team-name {
    font-size: 12px; font-weight: 600; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text); transition: color .15s;
  }

  .team-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px; font-weight: 800;
    min-width: 22px; text-align: center;
    color: var(--text); flex-shrink: 0;
  }

  .team-seed {
    font-size: 9px; font-weight: 700; letter-spacing: .05em;
    color: var(--text-muted); min-width: 22px; text-align: right; flex-shrink: 0;
  }

  /* states */
  .team.winner {
    background: linear-gradient(90deg, rgba(0,212,255,0.13) 0%, transparent 100%);
  }
  .team.winner .team-name { color: var(--accent); }
  .team.winner::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); border-radius: 3px 0 0 3px;
  }
  .team.eliminated .team-name,
  .team.eliminated .flag { opacity: .35; }
  .team.eliminated .team-score { opacity: .35; }

  .team.tbd .flag { visibility: hidden; }
  .team.tbd .team-name { color: var(--text-muted); font-style: italic; font-weight: 400; font-size: 11px; }
  .team.tbd .team-score { visibility: hidden; }

  /* ── FINAL CENTER ── */
  .final-stage {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 0 6px;
  }
  .final-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: .2em;
    color: var(--gold); text-transform: uppercase; white-space: nowrap;
    padding: 5px 16px; border-radius: 100px;
    border: 1px solid rgba(255,215,0,.3); background: rgba(255,215,0,.07);
  }
  .final-match { width: 158px; }
  .final-match .team { height: 54px; }
  .final-match .team-name { font-size: 13px; }
  .final-match .flag { font-size: 22px; }
  .final-match.crowned {
    border-color: rgba(255,215,0,.5) !important;
    box-shadow: 0 0 48px rgba(255,215,0,.15), 0 0 96px rgba(255,215,0,.06) !important;
  }
  .final-meta {
    text-align: center; font-size: 10px; color: var(--text-muted);
    line-height: 1.8; letter-spacing: .07em;
  }
  .champion-display {
    text-align: center; margin-top: 4px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; font-weight: 900; color: var(--gold);
    letter-spacing: .15em; text-transform: uppercase;
    animation: goldpulse 2s ease-in-out infinite alternate;
  }
  @keyframes goldpulse {
    from { text-shadow: 0 0 10px rgba(255,215,0,.4); }
    to   { text-shadow: 0 0 28px rgba(255,215,0,.8); }
  }

  /* ── SVG CONNECTORS ── */
  .connector-svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible; z-index: 0;
  }

  /* ── LOADING SKELETON ── */
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.8s infinite;
    border-radius: 4px; height: 12px;
  }
  @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 0 24px 48px;
    font-size: 11px; color: var(--text-muted); letter-spacing: .06em;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="eyebrow">FIFA World Cup 2026</div>
  <h1>KNOCKOUT BRACKET</h1>
  <div class="header-meta">USA · CANADA · MEXICO &nbsp;·&nbsp; FINAL: JULY 19, 2026 · MetLife Stadium, New Jersey</div>

  <div class="status-bar">
    <span class="pill pill-live" id="live-indicator">LIVE DATA</span>
    <span class="pill pill-update" id="refresh-pill">Fetching results…</span>
  </div>
  <div id="last-updated"></div>
</header>

<div class="bracket-scroll">
  <div class="bracket" id="bracket">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;letter-spacing:.06em;">
      Loading bracket…
    </div>
  </div>
</div>

<footer>
  <p>Built for <a href="https://wanderingskypixels.com" target="_blank">wanderingskypixels.com</a> &nbsp;·&nbsp; Auto-refreshes every 90 seconds &nbsp;·&nbsp; Data via ESPN</p>
</footer>

</div>

<script>
// ─────────────────────────────────────────────────────────────
// TEAM DATA
// ─────────────────────────────────────────────────────────────

const FLAGS = {
  'South Africa':'🇿🇦','Canada':'🇨🇦','Netherlands':'🇳🇱','Morocco':'🇲🇦',
  'Germany':'🇩🇪','Paraguay':'🇵🇾','France':'🇫🇷','Sweden':'🇸🇪',
  'United States':'🇺🇸','Bosnia & Herz.':'🇧🇦','Belgium':'🇧🇪','Senegal':'🇸🇳',
  'Portugal':'🇵🇹','Croatia':'🇭🇷','Spain':'🇪🇸','Austria':'🇦🇹',
  'Brazil':'🇧🇷','Japan':'🇯🇵','Ivory Coast':'🇨🇮','Norway':'🇳🇴',
  'Mexico':'🇲🇽','Ecuador':'🇪🇨','England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','DR Congo':'🇨🇩',
  'Argentina':'🇦🇷','Cabo Verde':'🇨🇻','Australia':'🇦🇺','Egypt':'🇪🇬',
  'Switzerland':'🇨🇭','Algeria':'🇩🇿','Colombia':'🇨🇴','Ghana':'🇬🇭',
};

const SEEDS = {
  'South Africa':'2A','Canada':'2B','Netherlands':'1F','Morocco':'2C',
  'Germany':'1E','Paraguay':'3D','France':'1I','Sweden':'3F',
  'United States':'1D','Bosnia & Herz.':'3B','Belgium':'1G','Senegal':'3I',
  'Portugal':'2K','Croatia':'2L','Spain':'1H','Austria':'2J',
  'Brazil':'1C','Japan':'2F','Ivory Coast':'2E','Norway':'2I',
  'Mexico':'1A','Ecuador':'3E','England':'1L','DR Congo':'3K',
  'Argentina':'1J','Cabo Verde':'2H','Australia':'2D','Egypt':'2G',
  'Switzerland':'1B','Algeria':'3J','Colombia':'1K','Ghana':'3L',
};

// ESPN name → our canonical name
const ESPN_ALIAS = {
  'USA':'United States',
  'United States of America':'United States',
  'Bosnia and Herzegovina':'Bosnia & Herz.',
  'Bosnia & Herzegovina':'Bosnia & Herz.',
  'Côte d\'Ivoire':'Ivory Coast',
  "Cote d'Ivoire":'Ivory Coast',
  'Ivory Coast':'Ivory Coast',
  'Congo DR':'DR Congo',
  'DR Congo':'DR Congo',
  'Democratic Republic of Congo':'DR Congo',
  'Cape Verde':'Cabo Verde',
  'Cabo Verde':'Cabo Verde',
};

function canonicalize(name) {
  if (!name) return null;
  name = name.trim();
  if (ESPN_ALIAS[name]) return ESPN_ALIAS[name];
  // direct match
  if (FLAGS[name]) return name;
  // partial match
  const lower = name.toLowerCase();
  for (const k of Object.keys(FLAGS)) {
    if (k.toLowerCase() === lower) return k;
    if (lower.includes(k.toLowerCase()) || k.toLowerCase().includes(lower)) return k;
  }
  return name;
}

// ─────────────────────────────────────────────────────────────
// BRACKET STRUCTURE  (R32 slot → [teamA, teamB])
// Left side: slots 0–7, Right side: slots 8–15
// ─────────────────────────────────────────────────────────────
const R32 = [
  ['South Africa','Canada'],
  ['Netherlands','Morocco'],
  ['Germany','Paraguay'],
  ['France','Sweden'],
  ['United States','Bosnia & Herz.'],
  ['Belgium','Senegal'],
  ['Portugal','Croatia'],
  ['Spain','Austria'],
  ['Brazil','Japan'],
  ['Ivory Coast','Norway'],
  ['Mexico','Ecuador'],
  ['England','DR Congo'],
  ['Argentina','Cabo Verde'],
  ['Australia','Egypt'],
  ['Switzerland','Algeria'],
  ['Colombia','Ghana'],
];

// Results state: populated by API
// Each entry: { teamA, teamB, winner, scoreA, scoreB, status }
// status: 'pre' | 'in' | 'post'
let results = {
  r32: Array(16).fill(null).map(() => ({ winner:null, scoreA:null, scoreB:null, status:'pre' })),
  r16: Array(8).fill(null).map(() => ({ teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' })),
  qf:  Array(4).fill(null).map(() => ({ teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' })),
  sf:  Array(2).fill(null).map(() => ({ teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' })),
  final: { teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' },
};

// Propagate R32 winners into R16 slots, R16→QF, etc.
function propagate() {
  // R32 → R16
  // Left:  r32[0,1]→r16[0], r32[2,3]→r16[1], r32[4,5]→r16[2], r32[6,7]→r16[3]
  // Right: r32[8,9]→r16[4], r32[10,11]→r16[5], r32[12,13]→r16[6], r32[14,15]→r16[7]
  for (let i = 0; i < 8; i++) {
    const a = results.r32[i*2];
    const b = results.r32[i*2+1];
    results.r16[i].teamA = a.winner || null;
    results.r16[i].teamB = b.winner || null;
  }

  // R16 → QF
  // Left:  r16[0,1]→qf[0], r16[2,3]→qf[1]
  // Right: r16[4,5]→qf[2], r16[6,7]→qf[3]
  for (let i = 0; i < 4; i++) {
    const a = results.r16[i*2];
    const b = results.r16[i*2+1];
    results.qf[i].teamA = a.winner || null;
    results.qf[i].teamB = b.winner || null;
  }

  // QF → SF
  // qf[0,1]→sf[0], qf[2,3]→sf[1]
  for (let i = 0; i < 2; i++) {
    const a = results.qf[i*2];
    const b = results.qf[i*2+1];
    results.sf[i].teamA = a.winner || null;
    results.sf[i].teamB = b.winner || null;
  }

  // SF → Final
  results.final.teamA = results.sf[0].winner || null;
  results.final.teamB = results.sf[1].winner || null;
}

// ─────────────────────────────────────────────────────────────
// ESPN API FETCH
// ─────────────────────────────────────────────────────────────

// Dates covering the entire knockout stage (R32 starts ~June 26)
const KNOCKOUT_DATES = [];
(function() {
  const start = new Date('2026-06-26');
  const end   = new Date('2026-07-20');
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    KNOCKOUT_DATES.push(d.toISOString().slice(0,10).replace(/-/g,''));
  }
})();

async function fetchESPN(date) {
  const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${date}`;
  const r = await fetch(url);
  if (!r.ok) return [];
  const data = await r.json();
  return data.events || [];
}

function parseEvent(ev) {
  const comp = ev.competitions?.[0];
  if (!comp) return null;
  const comps = comp.competitors || [];
  if (comps.length < 2) return null;

  // ESPN orders home/away differently — just get both
  const c0 = comps.find(c => c.homeAway === 'home') || comps[0];
  const c1 = comps.find(c => c.homeAway === 'away') || comps[1];

  const nameA = canonicalize(c0.team?.displayName || c0.team?.name);
  const nameB = canonicalize(c1.team?.displayName || c1.team?.name);
  const scoreA = c0.score != null ? parseInt(c0.score) : null;
  const scoreB = c1.score != null ? parseInt(c1.score) : null;

  const statusType = comp.status?.type?.name || ev.status?.type?.name || '';
  const status = statusType.includes('STATUS_FINAL') ? 'post'
               : statusType.includes('STATUS_IN_PROGRESS') ? 'in'
               : 'pre';

  let winner = null;
  if (status === 'post') {
    // Check winner flag
    const wComp = comps.find(c => c.winner === true);
    if (wComp) {
      winner = canonicalize(wComp.team?.displayName || wComp.team?.name);
    } else if (scoreA != null && scoreB != null) {
      winner = scoreA > scoreB ? nameA : scoreB > scoreA ? nameB : null;
    }
  }

  return { nameA, nameB, scoreA, scoreB, status, winner };
}

function applyResult(parsed) {
  if (!parsed) return;
  const { nameA, nameB, scoreA, scoreB, status, winner } = parsed;

  // Try R32
  for (let i = 0; i < 16; i++) {
    const [a, b] = R32[i];
    if ((a === nameA && b === nameB) || (a === nameB && b === nameA)) {
      const flipped = a === nameB;
      results.r32[i].winner = winner;
      results.r32[i].scoreA = flipped ? scoreB : scoreA;
      results.r32[i].scoreB = flipped ? scoreA : scoreB;
      results.r32[i].status = status;
      return;
    }
  }

  // Try R16 (teams filled by propagation)
  for (let i = 0; i < 8; i++) {
    const { teamA: a, teamB: b } = results.r16[i];
    if (!a || !b) continue;
    if ((a === nameA && b === nameB) || (a === nameB && b === nameA)) {
      const flipped = a === nameB;
      results.r16[i].winner = winner;
      results.r16[i].scoreA = flipped ? scoreB : scoreA;
      results.r16[i].scoreB = flipped ? scoreA : scoreB;
      results.r16[i].status = status;
      return;
    }
  }

  // Try QF
  for (let i = 0; i < 4; i++) {
    const { teamA: a, teamB: b } = results.qf[i];
    if (!a || !b) continue;
    if ((a === nameA && b === nameB) || (a === nameB && b === nameA)) {
      const flipped = a === nameB;
      results.qf[i].winner = winner;
      results.qf[i].scoreA = flipped ? scoreB : scoreA;
      results.qf[i].scoreB = flipped ? scoreA : scoreB;
      results.qf[i].status = status;
      return;
    }
  }

  // Try SF
  for (let i = 0; i < 2; i++) {
    const { teamA: a, teamB: b } = results.sf[i];
    if (!a || !b) continue;
    if ((a === nameA && b === nameB) || (a === nameB && b === nameA)) {
      const flipped = a === nameB;
      results.sf[i].winner = winner;
      results.sf[i].scoreA = flipped ? scoreB : scoreA;
      results.sf[i].scoreB = flipped ? scoreA : scoreB;
      results.sf[i].status = status;
      return;
    }
  }

  // Try Final
  const { teamA: fa, teamB: fb } = results.final;
  if (fa && fb) {
    if ((fa === nameA && fb === nameB) || (fa === nameB && fb === nameA)) {
      const flipped = fa === nameB;
      results.final.winner = winner;
      results.final.scoreA = flipped ? scoreB : scoreA;
      results.final.scoreB = flipped ? scoreA : scoreB;
      results.final.status = status;
    }
  }
}

async function fetchAll() {
  setStatus('Fetching…', 'update');
  try {
    // Fetch in parallel batches of 5
    const chunkSize = 5;
    const allEvents = [];
    for (let i = 0; i < KNOCKOUT_DATES.length; i += chunkSize) {
      const chunk = KNOCKOUT_DATES.slice(i, i + chunkSize);
      const fetches = await Promise.all(chunk.map(d => fetchESPN(d).catch(() => [])));
      fetches.forEach(evs => allEvents.push(...evs));
    }

    // Reset r32 results, keep structure
    results.r32 = Array(16).fill(null).map(() => ({ winner:null, scoreA:null, scoreB:null, status:'pre' }));
    results.r16 = Array(8).fill(null).map(() => ({ teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' }));
    results.qf  = Array(4).fill(null).map(() => ({ teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' }));
    results.sf  = Array(2).fill(null).map(() => ({ teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' }));
    results.final = { teamA:null, teamB:null, winner:null, scoreA:null, scoreB:null, status:'pre' };

    // First pass: R32
    allEvents.forEach(ev => { applyResult(parseEvent(ev)); });
    propagate();
    // Second pass: later rounds now have teamA/teamB
    allEvents.forEach(ev => { applyResult(parseEvent(ev)); });
    propagate();
    // Third pass
    allEvents.forEach(ev => { applyResult(parseEvent(ev)); });
    propagate();

    const now = new Date();
    document.getElementById('last-updated').textContent =
      `Last updated ${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;

    const hasLive = [
      ...results.r32, ...results.r16, ...results.qf, ...results.sf, results.final
    ].some(m => m.status === 'in');
    setStatus(hasLive ? 'MATCHES IN PROGRESS' : 'Auto-refreshes every 90s', hasLive ? 'live' : 'update');

    render();
  } catch(e) {
    setStatus('Connection error — retrying…', 'error');
    console.error(e);
  }
}

function setStatus(msg, type) {
  const pill = document.getElementById('refresh-pill');
  pill.textContent = msg;
  pill.className = 'pill pill-' + type;
}

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────

function teamRow(name, isWinner, isElim, score, isTbd) {
  if (isTbd || !name) {
    return `<div class="team tbd">
      <span class="flag">🏳</span>
      <span class="team-name">TBD</span>
      <span class="team-score"></span>
    </div>`;
  }
  const cls = isWinner ? 'winner' : isElim ? 'eliminated' : '';
  const flag = FLAGS[name] || '🏳';
  const scoreHtml = score != null ? `<span class="team-score">${score}</span>` : `<span class="team-score"></span>`;
  return `<div class="team ${cls}">
    <span class="flag">${flag}</span>
    <span class="team-name">${name}</span>
    ${scoreHtml}
  </div>`;
}

function matchCard(teamA, teamB, result, matchClass='') {
  const { winner, scoreA, scoreB, status } = result;
  const aWon = winner === teamA;
  const bWon = winner === teamB;
  const decided = !!winner;
  const isLive = status === 'in';

  const liveTag = isLive ? '<span class="live-badge">LIVE</span>' : '';

  return `<div class="match ${isLive ? 'live-match' : ''} ${matchClass}">
    ${liveTag}
    ${teamRow(teamA, aWon, decided && !aWon, scoreA, !teamA)}
    <div class="team-divider"></div>
    ${teamRow(teamB, bWon, decided && !bWon, scoreB, !teamB)}
  </div>`;
}

function render() {
  const bracket = document.getElementById('bracket');
  bracket.innerHTML = '';
  bracket.style.position = 'relative';

  // ── Left R32 ──
  const lR32 = makeCol('Round of 32');
  for (let i = 0; i < 8; i++) {
    const [a,b] = R32[i];
    lR32.body.innerHTML += `<div class="match-wrap">${matchCard(a,b,results.r32[i])}</div>`;
  }

  // ── Left R16 ──
  const lR16 = makeCol('Round of 16');
  for (let i = 0; i < 4; i++) {
    const r = results.r16[i];
    lR16.body.innerHTML += `<div class="match-wrap">${matchCard(r.teamA, r.teamB, r)}</div>`;
  }

  // ── Left QF ──
  const lQF = makeCol('Quarter-Finals');
  for (let i = 0; i < 2; i++) {
    const r = results.qf[i];
    lQF.body.innerHTML += `<div class="match-wrap">${matchCard(r.teamA, r.teamB, r)}</div>`;
  }

  // ── Left SF ──
  const lSF = makeCol('Semi-Finals');
  {
    const r = results.sf[0];
    lSF.body.innerHTML += `<div class="match-wrap">${matchCard(r.teamA, r.teamB, r)}</div>`;
  }

  // ── Center Final ──
  const center = document.createElement('div');
  center.className = 'col center-col';
  const f = results.final;
  const crowned = !!f.winner;
  center.innerHTML = `
    <div class="round-header" style="opacity:0">·</div>
    <div class="final-stage">
      <div class="final-label">🏆 FINAL</div>
      ${matchCard(f.teamA, f.teamB, f, 'final-match' + (crowned ? ' crowned' : ''))}
      <div class="final-meta">JULY 19, 2026<br>MetLife Stadium<br>New Jersey</div>
      ${crowned ? `<div class="champion-display">🏆 ${FLAGS[f.winner]||''} ${f.winner}</div>` : ''}
    </div>`;

  // ── Right SF ──
  const rSF = makeCol('Semi-Finals');
  {
    const r = results.sf[1];
    rSF.body.innerHTML += `<div class="match-wrap">${matchCard(r.teamA, r.teamB, r)}</div>`;
  }

  // ── Right QF ──
  const rQF = makeCol('Quarter-Finals');
  for (let i = 2; i < 4; i++) {
    const r = results.qf[i];
    rQF.body.innerHTML += `<div class="match-wrap">${matchCard(r.teamA, r.teamB, r)}</div>`;
  }

  // ── Right R16 ──
  const rR16 = makeCol('Round of 16');
  for (let i = 4; i < 8; i++) {
    const r = results.r16[i];
    rR16.body.innerHTML += `<div class="match-wrap">${matchCard(r.teamA, r.teamB, r)}</div>`;
  }

  // ── Right R32 ──
  const rR32 = makeCol('Round of 32');
  for (let i = 8; i < 16; i++) {
    const [a,b] = R32[i];
    rR32.body.innerHTML += `<div class="match-wrap">${matchCard(a,b,results.r32[i])}</div>`;
  }

  bracket.appendChild(lR32.el);
  bracket.appendChild(lR16.el);
  bracket.appendChild(lQF.el);
  bracket.appendChild(lSF.el);
  bracket.appendChild(center);
  bracket.appendChild(rSF.el);
  bracket.appendChild(rQF.el);
  bracket.appendChild(rR16.el);
  bracket.appendChild(rR32.el);

  requestAnimationFrame(drawLines);
}

function makeCol(label) {
  const el = document.createElement('div');
  el.className = 'col';
  el.innerHTML = `<div class="round-header">${label}</div>`;
  const body = document.createElement('div');
  body.className = 'matches-col';
  el.appendChild(body);
  return { el, body };
}

// ─────────────────────────────────────────────────────────────
// SVG CONNECTOR LINES
// ─────────────────────────────────────────────────────────────
function drawLines() {
  document.querySelectorAll('.connector-svg').forEach(e => e.remove());

  const bracket = document.getElementById('bracket');
  const bRect = bracket.getBoundingClientRect();

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.classList.add('connector-svg');
  svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0;';
  bracket.appendChild(svg);

  const rX = el => { const r = el.getBoundingClientRect(); return r.right - bRect.left; };
  const lX = el => { const r = el.getBoundingClientRect(); return r.left - bRect.left; };
  const mY = el => { const r = el.getBoundingClientRect(); return r.top - bRect.top + r.height / 2; };

  function line(x1,y1,x2,y2) {
    const p = document.createElementNS('http://www.w3.org/2000/svg','line');
    p.setAttribute('x1',x1); p.setAttribute('y1',y1);
    p.setAttribute('x2',x2); p.setAttribute('y2',y2);
    p.setAttribute('stroke','rgba(0,212,255,0.15)');
    p.setAttribute('stroke-width','1.5');
    p.setAttribute('stroke-linecap','round');
    svg.appendChild(p);
  }

  function connectPair(elA, elB, toEl, goRight) {
    if (!elA || !elB || !toEl) return;
    const y1 = mY(elA), y2 = mY(elB), yMid = (y1+y2)/2;
    if (goRight) {
      const x1 = rX(elA), x2 = rX(elB), xTo = lX(toEl);
      const xMid = (x1+xTo)/2;
      line(x1,y1,xMid,y1); line(xMid,y1,xMid,y2); line(xMid,y2,x2,y2);
      line(xMid,yMid,xTo,yMid);
    } else {
      const x1 = lX(elA), x2 = lX(elB), xTo = rX(toEl);
      const xMid = (x1+xTo)/2;
      line(x1,y1,xMid,y1); line(xMid,y1,xMid,y2); line(xMid,y2,x2,y2);
      line(xMid,yMid,xTo,yMid);
    }
  }

  function qSel(stage, idx) {
    return document.querySelector(`.match[data-sidx="${stage}-${idx}"]`);
  }

  // Tag all matches with data-sidx for easy selection
  const allMatches = bracket.querySelectorAll('.match');
  let si = 0;
  // Order: lR32(0-7), lR16(0-3), lQF(0-1), lSF(0), center, rSF(1), rQF(2-3), rR16(4-7), rR32(8-15)
  const order = [
    ...Array.from({length:8},(_,i)=>`r32-${i}`),
    ...Array.from({length:4},(_,i)=>`r16-${i}`),
    ...Array.from({length:2},(_,i)=>`qf-${i}`),
    [`sf-0`], [`final-0`], [`sf-1`],
    ...Array.from({length:2},(_,i)=>`qf-${i+2}`),
    ...Array.from({length:4},(_,i)=>`r16-${i+4}`),
    ...Array.from({length:8},(_,i)=>`r32-${i+8}`),
  ].flat();

  allMatches.forEach((m, i) => { if(order[i]) m.dataset.sidx = order[i]; });

  // Left side connections
  for (let i = 0; i < 4; i++) {
    const a = bracket.querySelector(`[data-sidx="r32-${i*2}"]`);
    const b = bracket.querySelector(`[data-sidx="r32-${i*2+1}"]`);
    const to = bracket.querySelector(`[data-sidx="r16-${i}"]`);
    connectPair(a, b, to, true);
  }
  for (let i = 0; i < 2; i++) {
    const a = bracket.querySelector(`[data-sidx="r16-${i*2}"]`);
    const b = bracket.querySelector(`[data-sidx="r16-${i*2+1}"]`);
    const to = bracket.querySelector(`[data-sidx="qf-${i}"]`);
    connectPair(a, b, to, true);
  }
  {
    const a = bracket.querySelector(`[data-sidx="qf-0"]`);
    const b = bracket.querySelector(`[data-sidx="qf-1"]`);
    const to = bracket.querySelector(`[data-sidx="sf-0"]`);
    connectPair(a, b, to, true);
  }
  {
    const a = bracket.querySelector(`[data-sidx="sf-0"]`);
    const b = bracket.querySelector(`[data-sidx="sf-1"]`);
    const to = bracket.querySelector(`[data-sidx="final-0"]`);
    // SF to final: draw from right of sf-0 and left of sf-1 to the final center
    if (a && b && to) {
      const yA = mY(a), yB = mY(b), xA = rX(a), xTo = lX(to);
      const xMid = (xA + xTo)/2;
      line(xA, yA, xMid, yA); line(xMid, yA, xMid, yA); line(xMid, yA, xTo, yA);

      const xB = lX(b), xToR = rX(to);
      const xMid2 = (xB + xToR)/2;
      line(xB, yB, xMid2, yB); line(xMid2, yB, xMid2, yB); line(xMid2, yB, xToR, yB);
    }
  }

  // Right side connections
  for (let i = 0; i < 4; i++) {
    const a = bracket.querySelector(`[data-sidx="r32-${8+i*2}"]`);
    const b = bracket.querySelector(`[data-sidx="r32-${8+i*2+1}"]`);
    const to = bracket.querySelector(`[data-sidx="r16-${i+4}"]`);
    connectPair(a, b, to, false);
  }
  for (let i = 0; i < 2; i++) {
    const a = bracket.querySelector(`[data-sidx="r16-${4+i*2}"]`);
    const b = bracket.querySelector(`[data-sidx="r16-${4+i*2+1}"]`);
    const to = bracket.querySelector(`[data-sidx="qf-${i+2}"]`);
    connectPair(a, b, to, false);
  }
  {
    const a = bracket.querySelector(`[data-sidx="qf-2"]`);
    const b = bracket.querySelector(`[data-sidx="qf-3"]`);
    const to = bracket.querySelector(`[data-sidx="sf-1"]`);
    connectPair(a, b, to, false);
  }
}

// ─────────────────────────────────────────────────────────────
// AUTO-REFRESH
// ─────────────────────────────────────────────────────────────
fetchAll();
setInterval(fetchAll, 90_000);
window.addEventListener('resize', () => {
  document.querySelectorAll('.connector-svg').forEach(e => e.remove());
  requestAnimationFrame(drawLines);
});
</script>
